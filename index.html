<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover가 있어야 responsive-base.css의 safe-area 대응이 켜진다.
     maximum-scale·user-scalable=no를 넣지 않는다 — 안드로이드 크롬은 그걸 지켜서 확대가 막힌다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이 대사, 어느 무대? — 명대사 하나로 작품 맞히기 | acttub</title>
<meta name="description" content="고전 희곡의 대사 한 줄만 보고 어느 작품인지 맞혀보세요. 5문제부터 40문제까지 원하는 만큼. 해설마다 그 대사를 연기할 때 먼저 답해야 할 질문이 붙습니다.">
<link rel="canonical" href="https://stage.acttub.com/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://stage.acttub.com/">
<meta property="og:title" content="이 대사, 어느 무대?">
<meta property="og:description" content="대사 한 줄만 보고 작품을 맞혀보세요. 5문제부터 40문제까지.">
<meta property="og:site_name" content="acttub">
<!-- 공유 카드. 상대경로를 쓰면 카카오톡·페이스북이 못 받아오므로 절대 주소로 둔다.
     이미지는 design/render-og.py가 만든다 — 문구를 바꾸면 그 스크립트를 다시 돌린다. -->
<meta property="og:image" content="https://stage.acttub.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="이 대사, 어느 무대? 대사 한 줄만 보고 작품 맞히기">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">

<!-- 방문 계측. vercel.json이 catch-all 폴백을 쓰지 않는 이유가 이 경로다 —
     폴백이 /_vercel/* 를 삼키면 이 스크립트가 404가 되고 계측이 조용히 죽는다. -->
<script defer src="/_vercel/insights/script.js"></script>

<!-- GA4. 프로덕션 호스트에서만 로드한다 — 로컬·프리뷰가 섞이면 유입 수를 믿을 수 없게 된다.
     시트 전송(app.js)이 쓰는 것과 같은 가드다. -->
<script>
(function(){
  if(!/(^|\.)acttub\.com$/.test(location.hostname))return;
  var ID='G-DRMEWBN9Y9';
  var s=document.createElement('script');
  s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;
  document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){window.dataLayer.push(arguments);};
  window.gtag('js',new Date());
  // 자동 page_view를 끄고 지금 주소로 직접 한 번 쏜다. acti가 쓰는 것과 같은 방식이다.
  // 자동에 맡기면 gtag.js가 늦게 뜬 사이에 app.js가 주소를 바꿔버려(로드 직후 replaceState로
  // '/'로 되돌리는 경로가 있다), 유입 UTM이 붙은 첫 주소가 아니라 바뀐 주소가 기록된다.
  // page_location을 config가 아니라 이벤트에 실는 이유: config에 실으면 그 값이 이후 모든
  // 이벤트의 기본값으로 눌러앉아 acttub_cta까지 랜딩 주소로 기록된다.
  window.gtag('config',ID,{send_page_view:false});
  window.gtag('event','page_view',{page_location:location.href});
})();
</script>
</head>
<body class="bg-neutral text-ink font-sans antialiased">

<!-- 문장은 전부 copy.js에서 주입한다. 이 파일에는 화면 골격만 둔다.
     디자인 시안은 design/화면-2026-07-28.pen — 캔버스는 시안까지고, 이 마크업이 구현 기준이다. -->
<div class="tier-root">
<main class="tier-shell pb-xl">

  <!-- ── 시작 ───────────────────────────────────────────────── -->
  <section id="screen-start" hidden>
    <!-- 헤더는 화면 폭을 꽉 채운다. tier-shell의 좌우 여백만큼 되밀어야 가장자리까지 색이 간다. -->
    <div class="bleed bleed-top rise bg-brand pb-xxl text-white">
      <div class="text-body-md font-bold opacity-90" data-copy="start.brand"></div>
      <!-- 두 줄로 세우되 제목은 하나다. h1을 두 개 두면 문서 개요상 최상위 제목이 둘이 된다. -->
      <h1 class="mt-md text-h1">
        <span class="block" data-copy="start.titleLine1"></span>
        <span class="block" data-copy="start.titleLine2"></span>
      </h1>
      <p class="mt-[14px] text-body-lg opacity-85 break-keep" data-copy="start.lead"></p>
    </div>

    <!-- 미리보기 카드가 헤더를 파고든다. 설명 대신 실제 문제 한 장을 보여주는 자리다.
         통째로 aria-hidden인 이유: 보기만 숨기면 스크린리더가 "이 대사가 나오는 작품은?"과
         대사만 읽고 보기는 못 읽어, 답할 수 없는 질문이 하나 떠 있는 것처럼 들린다.
         진짜 문제는 시작 버튼을 누른 뒤에 나오고, 이 화면의 설명은 아래 문장이 대신한다. -->
    <div class="card -mt-xl px-lg py-lg" aria-hidden="true">
      <div class="text-label text-primary" data-copy="start.previewLabel"></div>
      <blockquote class="mt-md text-h2 break-keep" data-copy="start.previewLine"></blockquote>
      <div id="preview-choices" class="mt-md grid grid-cols-2 gap-sm opacity-55"></div>
    </div>

    <div class="mt-xl">
      <!-- 칩 넷을 한 줄에 세우면 320px에서 "약 1분 30초"가 넘친다. 두 줄로 나눈다. -->
      <div id="round-size-group" class="grid grid-cols-2 gap-sm" role="radiogroup"
           data-copy-aria-label="start.sizeLabel">
        <button type="button" class="round-size" role="radio" aria-checked="false" tabindex="-1" data-round-size="5">
          <span class="text-subtitle font-bold" data-copy="start.sizes.5.count"></span>
          <span class="round-size-time text-body-sm text-ink-tertiary" data-copy="start.sizes.5.time"></span>
        </button>
        <button type="button" class="round-size" role="radio" aria-checked="true" tabindex="0" data-round-size="10">
          <span class="text-subtitle font-bold" data-copy="start.sizes.10.count"></span>
          <span class="round-size-time text-body-sm text-ink-tertiary" data-copy="start.sizes.10.time"></span>
        </button>
        <button type="button" class="round-size" role="radio" aria-checked="false" tabindex="-1" data-round-size="20">
          <span class="text-subtitle font-bold" data-copy="start.sizes.20.count"></span>
          <span class="round-size-time text-body-sm text-ink-tertiary" data-copy="start.sizes.20.time"></span>
        </button>
        <button type="button" class="round-size" role="radio" aria-checked="false" tabindex="-1" data-round-size="40">
          <span class="text-subtitle font-bold" data-copy="start.sizes.40.count"></span>
          <span class="round-size-time text-body-sm text-ink-tertiary" data-copy="start.sizes.40.time"></span>
        </button>
      </div>
      <button id="btn-start" class="btn btn-primary mt-md" data-copy="start.button"></button>
      <p class="mt-md text-center text-body-sm text-ink-tertiary break-keep" data-copy="start.note"></p>
    </div>
  </section>

  <!-- ── 문제 ───────────────────────────────────────────────── -->
  <section id="screen-quiz" hidden>
    <div class="mt-xl flex items-center gap-md">
      <!-- 몇 번째 문제인지는 옆의 "1 / 10" 텍스트가 읽어준다. 막대는 같은 정보의 그림이라 숨긴다. -->
      <div class="h-[6px] flex-1 overflow-hidden rounded-pill bg-line" aria-hidden="true">
        <div id="progress-bar" class="h-full rounded-pill bg-primary transition-[width] duration-200 ease-out" style="width: 0%"></div>
      </div>
      <div id="progress-text" class="shrink-0 text-body-sm font-bold text-ink-tertiary tabular-nums"></div>
    </div>

    <!-- 대사. 이 화면의 주인공이라 가장 크게 둔다. -->
    <div class="card mt-lg px-lg pt-lg pb-[30px]">
      <div class="text-label text-primary" data-copy="quiz.prompt"></div>
      <!-- tabindex="-1"은 다음 문제로 넘어갈 때 포커스를 여기로 옮기기 위한 것이다.
           안 하면 눌렀던 '다음 문제' 버튼이 숨겨지면서 포커스가 문서 맨 위로 떨어진다. -->
      <blockquote id="quiz-line" class="mt-md text-h2 break-keep" tabindex="-1"></blockquote>
    </div>

    <div id="choices" class="mt-lg grid gap-[10px]" role="group" aria-label="작품 고르기"></div>

    <!-- 답을 고른 뒤에만 열린다. 화자·장면·질문이 여기서 함께 나온다.
         aria-live로 묶어야 화면을 못 보는 사람도 정답 여부를 바로 듣는다 —
         포커스만 '다음 문제' 버튼으로 옮기면 맞았는지 틀렸는지가 통째로 빠진다. -->
    <div id="feedback" class="mt-lg grid gap-[10px]" hidden aria-live="polite" tabindex="-1">
      <div class="card px-lg py-md">
        <div id="verdict" class="text-subtitle font-bold"></div>
        <div class="mt-sm text-body-md">
          <span class="text-ink-tertiary" data-copy="quiz.answerLabel"></span>
          <span id="answer-work" class="ml-xs font-bold"></span>
          <span id="answer-meta" class="ml-xs text-ink-sub"></span>
        </div>
      </div>

      <div class="card px-lg py-md">
        <div class="text-label text-ink-tertiary" data-copy="quiz.contextLabel"></div>
        <p id="answer-context" class="mt-xs text-body-md text-ink-sub break-keep"></p>
      </div>

      <!-- 이 카드가 이 서비스의 정체다. 답을 주지 않는 질문이라 시각적으로도 가장 세게 둔다. -->
      <div class="ask-card px-lg py-lg">
        <div class="text-label text-primary-strong" data-copy="quiz.askLabel"></div>
        <p id="answer-ask" class="mt-sm text-body-lg font-semibold text-primary-deep break-keep"></p>
      </div>

      <button id="btn-next" class="btn btn-primary mt-sm"></button>
    </div>
  </section>

  <!-- ── 결과 ───────────────────────────────────────────────── -->
  <section id="screen-result" hidden>
    <div class="bleed bleed-top rise bg-brand pb-xl text-white">
      <div id="result-total" class="text-body-md font-bold opacity-80"></div>
      <div class="mt-xs flex items-end gap-xs">
        <span id="result-score" class="text-h1"></span>
        <span class="pb-[2px] text-h3 opacity-85" data-copy="result.unit"></span>
      </div>
      <!-- 결과로 넘어올 때 포커스를 여기로 옮긴다. 안 옮기면 마지막에 누른 버튼이 사라지면서
           포커스가 문서 맨 위로 떨어지고, 화면을 못 보는 사람에게 결과가 안내되지 않는다. -->
      <h1 id="result-label" class="mt-sm text-h1 break-keep" tabindex="-1"></h1>
      <p id="result-line" class="mt-sm text-body-lg opacity-85 break-keep"></p>
    </div>

    <section class="card mt-lg px-lg pt-lg pb-lg">
      <h2 class="text-subtitle font-bold" data-copy="result.missedTitle"></h2>
      <ul id="missed-list" class="mt-md grid gap-md"></ul>
    </section>

    <button id="btn-share" class="btn btn-secondary mt-[12px]" data-copy="result.shareButton"></button>

    <!-- 코어로 잇는 다리. 서브프로젝트가 코어가 아님을 여기서 밝힌다. -->
    <section class="card mt-[12px] px-lg py-lg">
      <h2 class="text-subtitle font-bold break-keep" data-copy="result.bridgeTitle"></h2>
      <p class="mt-sm text-body-md text-ink-sub break-keep" data-copy="result.bridgeBody"></p>
      <a id="btn-core" class="btn btn-outline mt-md" href="https://acttub.com/?utm_source=stage&utm_medium=subproject&utm_campaign=line-quiz"
         data-copy="result.bridgeButton"></a>
    </section>

    <button id="btn-replay" class="btn btn-quiet mt-[12px]" data-copy="start.replay"></button>
  </section>

  <footer class="mt-xl text-center text-body-sm text-ink-tertiary">
    <div class="font-semibold" data-copy="foot.brand"></div>
    <p class="mt-sm break-keep" data-copy="foot.source"></p>
  </footer>

</main>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
